services:
  comguard:
    build:
      context: ..
      dockerfile: whatsapp_chatbot/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    volumes:
      # The indexed corpus is built with ingest_corpus.py and mounted in, so
      # rebuilding the image does not mean re-embedding every gazette.
      - ./comguard_chroma_store:/app/comguard_chroma_store
